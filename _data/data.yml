experiences:
  title: Experiences
  info:
  - role: Reserve Pool Officer
    time: 2025 - Present
    company: City Savings Bank, Ortigas Pasig City
    details: |
        •	Primarily acts as a reliever for any position in the Branch that needs back up and/or additional manpower
        •	Responsible for performing objective, independent, and reliable assessments of the effectiveness of a bank's risk management activities, its compliance with applicable regulations, and its internal control-     environment.
        •	Ensures the performance of all internal control by conducting review and testing functions to prevent and detect or eliminate the risk for possible loss.
        •	Ensures proper compliance of bank-wide policies in their assigned branches
        •	Monitors the service quality level of the branch in relation to client’s expectations and internal service standards and eliminates all factors that get in the way of efficient service delivery.

  - role: Branch Operations Head
    time: 2024 - 2025
    company: City Savings Bank, Ortigas Pasig City
    details: |
        •	Responsible for compliance with regulatory and internal policies and to achieve satisfactory audit ratings with no unsafe or unsound banking practices.
        •	Ensures the performance of all internal control to prevent, detect or eliminate the risk for possible loss.
        •	Exercises functional management over all service and operations personnel in the Branch
        •	Implements cost effectiveness' measures to reduce and manage the expenses of the branch
        •	Obtains branch commitment of quality service to the satisfaction of client’s individual needs
        •	Ensure compliance to conclusion, within a reasonable period of time (SLA), audit findings of the Branch and regularly report the status of such findings and/or corrective measures. 

  - role: Branch Service Officer
    time: 2019 - 2024
    company: City Savings Bank, Ortigas Pasig City
    details: |
        •	Performs and oversees beginning and end-of-day branch operating activities.
        •	Supervises cash services, ATM operations, and acts as chief custodian of peso cash, accountable forms, and post-dated checks.
        •	Ensures accountable forms, branch reports, and audit details are strictly verified, reconciled, and properly issued.
        •	Reviews, prepares, approves, and submits critical branch operational and compliance reports.
        •	Efficiently resolves customer concerns and escalation inquiries to maintain high client satisfaction standards.
        •	Supports the branch sales force by streamlining operational processes and actively promoting cross-selling opportunities.

  - role: Branch Service Associate
    time: 2016 - 2019
    company: City Savings Bank, Ortigas Pasig City
    details: |
        •	Accurately processed client loan applications and deposit transactions in accordance with strict turnaround guidelines.
        •	Ensured full compliance with regulatory requirements, central bank standards, and internal company policies.
        •	Prepared required daily, weekly, and monthly branch operational data and financial reports.
        •	Delivered excellent customer service to all clients in alignment with established service standards.


